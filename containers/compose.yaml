# Docker Compose for ferr (dev container + optional targets + optional playground)
#
# Usage:
#   Dev only:              docker compose up -d
#   With targets:          docker compose --profile targets up -d
#   With playground:       docker compose --profile playground up -d baseline_agents_host
#   Everything:            docker compose --profile targets --profile playground up -d
#   Enter dev container:   docker compose exec ferr_openhack_agent bash
#   Stop all:              docker compose --profile targets --profile playground down

name: ferr

x-playground-common: &playground-common
  stdin_open: true
  tty: true
  init: true
  restart: unless-stopped
  # Pass through host/env-file variables into the container.
  # With `make playground`, loaded from ./data/projects/playground.env (gitignored) if present.
  environment:
    - STRIX_LLM
    - LLM_API_KEY
    - LLM_API_BASE
    - PERPLEXITY_API_KEY
    - OPENAI_API_KEY
    - OPENAI_BASE_URL
    - PENTESTGPT_AUTH_MODE
    - ANTHROPIC_API_KEY
    - ALIAS_API_KEY
    - OLLAMA
    - OLLAMA_API_BASE
    - PROMPT_TOOLKIT_NO_CPR
    - CAI_STREAM
    - CAI_MODEL
    - CAI_AGENT_TYPE
    - CAI_OPENAI_API_KEY
    - STRIX_REASONING_EFFORT
    - STRIX_SANDBOX_HOST
    - STRIX_SANDBOX_NETWORK
  cap_add:
    - NET_RAW
    - NET_ADMIN
  # Allow agents inside the playground container to run sibling containers
  # (e.g. Strix sandbox) via the host Docker daemon.
  group_add:
    - "0" # /var/run/docker.sock is typically root:root 660 on Docker Desktop
  volumes:
    - ./data/projects:/playground/projects
    - ./data/projects/scans:/playground/scans
    - /var/run/docker.sock:/var/run/docker.sock
    # Persist Claude Code login across container recreations (used by PentestGPT).
    - playground-claude:/home/playground/.claude
  networks:
    - playground
    - baseline_attack_net

services:
  ferr_openhack_agent:
    image: openhack:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ferr_openhack_agent
    hostname: ferr_openhack_agent
    stdin_open: true
    tty: true
    init: true
    restart: unless-stopped
    cap_add:
      - NET_RAW
      - NET_ADMIN
    volumes:
      - ..:/app
      # Persist npx/npm downloads across container recreations (MCP servers use npx).
      - openhack-npm:/home/opencode/.npm
    networks:
      internal_net:
        aliases: ["openhack"]
      experiment_attack_net:
        aliases: ["openhack"]
      auxiliary_attack_net:
        aliases: ["openhack"]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:4096:4096" # opencode serve/web
      - "${OPENCODE_APP_PORT:-0}:3000"
    healthcheck:
      test: ["CMD-SHELL", "test -f /app/package.json && which bun >/dev/null && which nmap >/dev/null"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    command: /bin/bash

  baseline_agents_host:
    profiles: ["playground"]
    <<: *playground-common
    build:
      context: .
      dockerfile: Dockerfile.playground
    container_name: baseline_agents_host
    hostname: baseline_agents_host
    healthcheck:
      test: ["CMD-SHELL", "python3 --version >/dev/null && which uv >/dev/null && which poetry >/dev/null && which nmap >/dev/null"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    networks:
      playground: {}
      baseline_attack_net:
        aliases: ["agenthost"]
      auxiliary_attack_net:
        aliases: ["agenthost"]
    command: /bin/bash

  baseline_vulnerability_scanner:
    profiles: ["playground"]
    image: immauss/openvas:latest
    container_name: baseline_vulnerability_scanner
    hostname: baseline_vulnerability_scanner
    restart: unless-stopped
    environment:
      - USERNAME=admin
      - PASSWORD=admin
      - RELAYHOST=localhost
      - QUIET=true
    volumes:
      - gvm-data:/data
    networks:
      playground: {}
      baseline_attack_net:
        aliases: ["scanner"]
      auxiliary_attack_net:
        aliases: ["scanner"]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsSk http://localhost:9392/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 20
      start_period: 300s

  sut_juiceshop:
    profiles: ["targets"]
    image: bkimminich/juice-shop
    container_name: sut_juiceshop
    hostname: juiceshop
    restart: unless-stopped
    ports:
      - "127.0.0.1:3333:3000"
    environment:
      - NODE_ENV=unsafe
    networks:
      experiment_attack_net:
        aliases: ["juiceshop"]
      baseline_attack_net:
        aliases: ["juiceshop"]
    healthcheck:
      test: ["CMD", "/nodejs/bin/node", "-e", "require('http').get('http://localhost:3000/', (res) => { process.exit(res.statusCode < 400 ? 0 : 1); }).on('error', () => process.exit(1));"]
      interval: 30s
      timeout: 10s
      retries: 3

  aux_dvwa:
    profiles: ["targets"]
    image: vulnerables/web-dvwa
    platform: linux/amd64
    container_name: aux_dvwa
    hostname: dvwa
    restart: unless-stopped
    ports:
      - "127.0.0.1:3334:80"
    environment:
      - MYSQL_RANDOM_ROOT_PASSWORD=yes
    networks:
      auxiliary_attack_net:
        aliases: ["dvwa"]
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@file_get_contents('http://localhost/login.php') !== false ? 0 : 1);"]
      interval: 30s
      timeout: 10s
      retries: 3

  aux_bwapp:
    profiles: ["targets"]
    image: raesene/bwapp
    platform: linux/amd64
    container_name: aux_bwapp
    hostname: bwapp
    restart: unless-stopped
    ports:
      - "127.0.0.1:3335:80"
    networks:
      auxiliary_attack_net:
        aliases: ["bwapp"]
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@file_get_contents('http://localhost/login.php') !== false ? 0 : 1);"]
      interval: 30s
      timeout: 10s
      retries: 3

  sut_badstore:
    profiles: ["targets"]
    image: jvhoof/badstore-docker
    container_name: sut_badstore
    hostname: badstore
    restart: unless-stopped
    ports:
      - "127.0.0.1:3336:80"
    networks:
      experiment_attack_net:
        aliases: ["badstore"]
      baseline_attack_net:
        aliases: ["badstore"]
    healthcheck:
      test: ["CMD-SHELL", "test -s /var/run/apache2/apache2.pid"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  aux_webgoat:
    profiles: ["targets"]
    image: webgoat/webgoat
    container_name: aux_webgoat
    hostname: webgoat
    restart: unless-stopped
    ports:
      - "127.0.0.1:3337:8080"
      - "127.0.0.1:3338:9090"
    environment:
      - TZ=UTC
    networks:
      auxiliary_attack_net:
        aliases: ["webgoat"]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/WebGoat/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

networks:
  internal_net:
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 192.168.78.0/24
          gateway: 192.168.78.1
  baseline_attack_net:
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 192.168.79.0/24
          gateway: 192.168.79.1
  experiment_attack_net:
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 192.168.81.0/24
          gateway: 192.168.81.1
  auxiliary_attack_net:
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 192.168.82.0/24
          gateway: 192.168.82.1
  playground:
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 192.168.80.0/24
          gateway: 192.168.80.1

volumes:
  openhack-npm:
  playground-claude:
  gvm-data:
