# Docker Compose for openhackstack (OpenCode development + pentesting targets)
#
# Usage:
#   Run only dev:               docker compose up -d
#   Run with target apps:       docker compose --profile targets up -d
#   Enter dev container:        docker compose exec openhack bash
#   Stop services:              docker compose --profile targets down

name: openhackstack

x-playground-common: &playground-common
  stdin_open: true
  tty: true
  init: true
  restart: unless-stopped
  # Pass through host/env-file variables into the container.
  # With `make playground`, this is loaded from ./data/playground.env (gitignored) if present.
  environment:
    - STRIX_LLM
    - LLM_API_KEY
    - LLM_API_BASE
    - PERPLEXITY_API_KEY
    - OPENAI_API_KEY
    - OPENAI_BASE_URL
    - ANTHROPIC_API_KEY
    - ALIAS_API_KEY
    - OLLAMA
    - OLLAMA_API_BASE
    - PROMPT_TOOLKIT_NO_CPR
    - CAI_STREAM
    - CAI_MODEL
    - CAI_OPENAI_API_KEY
    - STRIX_REASONING_EFFORT
  cap_add:
    - NET_RAW
    - NET_ADMIN
  # Allow agents inside the playground container to run sibling containers
  # (e.g. Strix sandbox) via the host Docker daemon.
  group_add:
    - "0" # /var/run/docker.sock is typically root:root 660 on Docker Desktop
  volumes:
    - ./data/projects:/playground/projects
    - ./data/scans:/playground/scans
    - ./data/seclists:/usr/share/wordlists/seclists:ro
    - /var/run/docker.sock:/var/run/docker.sock
    # Persist Claude Code login across container recreations (used by PentestGPT).
    - playground-claude:/root/.claude
  networks:
    - openhackstack-network

services:
  openhack:
    build:
      context: .
      dockerfile: Dockerfile.openhack
    container_name: openhack
    hostname: openhack
    stdin_open: true
    tty: true
    init: true
    restart: unless-stopped
    cap_add:
      - NET_RAW
      - NET_ADMIN
    volumes:
      - ..:/app
      - ./data/seclists:/usr/share/wordlists/seclists:ro
      # Persist npx/npm downloads across container recreations (MCP servers use npx).
      - openhack-npm:/home/opencode/.npm
      # Persist Playwright browser downloads/cache (Linux default location).
      - openhack-playwright:/home/opencode/.cache/ms-playwright
    networks:
      - openhackstack-network
    extra_hosts:
      # Enable host Chrome debugging from inside the container (Linux engine + Desktop).
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:4096:4096" # opencode serve/web
      # packages/app (vite). Default to an ephemeral host port to avoid collisions.
      # Override with OPENCODE_APP_PORT=3000 (or any other port) if you want a fixed mapping.
      - "${OPENCODE_APP_PORT:-0}:3000"
    healthcheck:
      test: ["CMD-SHELL", "test -f /app/package.json && test -f /app/packages/opencode/package.json && which bun >/dev/null && which nmap >/dev/null"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    command: /bin/bash

  playground:
    profiles: ["playground"]
    <<: *playground-common
    build:
      context: .
      dockerfile: Dockerfile.playground
    container_name: playground-kali
    hostname: kali
    healthcheck:
      test: ["CMD-SHELL", "python3 --version >/dev/null && which uv >/dev/null && which poetry >/dev/null && which nmap >/dev/null"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    command: /bin/bash

  gvm:
    profiles: ["playground"]
    image: immauss/openvas:latest
    container_name: playground-gvm
    hostname: gvm
    restart: unless-stopped
    environment:
      - USERNAME=admin
      - PASSWORD=admin
      - RELAYHOST=localhost
      - QUIET=true
    volumes:
      - gvm-data:/data
    networks:
      - openhackstack-network
    healthcheck:
      test: ["CMD-SHELL", "curl -fsSk http://localhost:9392/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 20
      start_period: 300s

  juiceshop:
    profiles: ["targets"]
    image: bkimminich/juice-shop
    container_name: targets-juiceshop
    hostname: juiceshop
    restart: unless-stopped
    ports:
      - "127.0.0.1:3333:3000"
    environment:
      - NODE_ENV=unsafe
    networks:
      - openhackstack-network
    healthcheck:
      test: ["CMD", "/nodejs/bin/node", "-e", "require('http').get('http://localhost:3000/', (res) => { process.exit(res.statusCode < 400 ? 0 : 1); }).on('error', () => process.exit(1));"]
      interval: 30s
      timeout: 10s
      retries: 3

  dvwa:
    profiles: ["targets"]
    image: vulnerables/web-dvwa
    platform: linux/amd64
    container_name: targets-dvwa
    hostname: dvwa
    restart: unless-stopped
    ports:
      - "127.0.0.1:3334:80"
    environment:
      - MYSQL_RANDOM_ROOT_PASSWORD=yes
    networks:
      - openhackstack-network
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@file_get_contents('http://localhost/login.php') !== false ? 0 : 1);"]
      interval: 30s
      timeout: 10s
      retries: 3

  bwapp:
    profiles: ["targets"]
    image: raesene/bwapp
    platform: linux/amd64
    container_name: targets-bwapp
    hostname: bwapp
    restart: unless-stopped
    ports:
      - "127.0.0.1:3335:80"
    networks:
      - openhackstack-network
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@file_get_contents('http://localhost/login.php') !== false ? 0 : 1);"]
      interval: 30s
      timeout: 10s
      retries: 3

  badstore:
    profiles: ["targets"]
    image: jvhoof/badstore-docker
    container_name: targets-badstore
    hostname: badstore
    restart: unless-stopped
    ports:
      - "127.0.0.1:3336:80"
    networks:
      - openhackstack-network
    healthcheck:
      test: ["CMD-SHELL", "test -s /var/run/apache2/apache2.pid"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  webgoat:
    profiles: ["targets"]
    image: webgoat/webgoat
    container_name: targets-webgoat
    hostname: webgoat
    restart: unless-stopped
    ports:
      - "127.0.0.1:3337:8080"
      - "127.0.0.1:3338:9090"
    environment:
      - TZ=UTC
    networks:
      - openhackstack-network
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/WebGoat/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

networks:
  openhackstack-network:
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 192.168.77.0/24
          gateway: 192.168.77.1
    driver_opts:
      com.docker.network.bridge.name: "openhackstack0"
      com.docker.network.bridge.enable_ip_masquerade: "true"

volumes:
  openhack-npm:
  openhack-playwright:
  playground-claude:
  gvm-data:
